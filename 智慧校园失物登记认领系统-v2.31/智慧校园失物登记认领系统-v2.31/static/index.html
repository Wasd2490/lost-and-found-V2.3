<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#3b82f6">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔍</text></svg>">
<title>智慧校园失物登记认领系统</title>
<link rel="stylesheet" href="/css/style.css?v=2.3.0">
</head>
<body>
<nav class="navbar" id="navbar"></nav>

<div class="container">
  <div class="hero hero-carousel">
    <button class="carousel-arrow left" onclick="prevSlide()">&#10094;</button>
    <div class="carousel-track" id="carouselTrack">
      <div class="slide active">
        <h1>智慧校园失物登记认领系统</h1>
        <p class="hero-sub">帮助您快速找回丢失的物品</p>
      </div>
      <div class="slide">
        <h1>以图搜图 · 智能匹配</h1>
        <p class="hero-sub">上传照片，系统自动识别相似物品</p>
      </div>
      <div class="slide">
        <h1>陆空协同 · 无人配送</h1>
        <p class="hero-sub">无人车自动配送，扫码即可取件</p>
        <p class="hero-sub" style="font-size: 14px; opacity: 0.8;">功能待开发，敬请期待 V3 版本</p>
      </div>
    </div>
    <button class="carousel-arrow right" onclick="nextSlide()">&#10095;</button>
    <div class="carousel-dots" id="carouselDots">
      <span class="dot active" onclick="goSlide(0)"></span>
      <span class="dot" onclick="goSlide(1)"></span>
      <span class="dot" onclick="goSlide(2)"></span>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" data-type="lost" onclick="switchTab('lost')">寻物启事</div>
    <div class="tab" data-type="found" onclick="switchTab('found')">招领启事</div>
    <a href="/post-found.html" class="tab tab-action">领取登记</a>
  </div>

  <div class="search-bar">
    <input type="text" id="kw" placeholder="搜索物品名称、描述、地点..." onkeydown="if(event.key==='Enter')loadList()">
    <select id="category" onchange="loadList()">
      <option value="">全部分类</option>
      <option value="证件">证件</option>
      <option value="电子设备">电子设备</option>
      <option value="钥匙">钥匙</option>
      <option value="衣物">衣物</option>
      <option value="书籍">书籍</option>
      <option value="其他">其他</option>
    </select>
    <button class="btn" onclick="loadList()">搜索</button>
    <button class="btn secondary" id="camera-btn" title="以图搜图" onclick="document.getElementById('image-search-input').click()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
    </button>
    <input type="file" id="image-search-input" accept="image/*" style="display:none;" onchange="handleImageSearch(this)">
  </div>

  <div id="image-search-banner" style="display:none;margin-bottom:14px;"></div>
  <div id="list" class="item-grid"></div>
  <div id="pagination"></div>
</div>

<div class="footer">智慧校园失物登记认领系统 </div>

<script src="/js/common.js?v=2.3.0"></script>
<script>
// ===== 轮播 Banner =====
let slideIdx = 0;
const slides = document.querySelectorAll('.carousel-track .slide');
const dots = document.querySelectorAll('.carousel-dots .dot');

function goSlide(i) {
  slideIdx = (i + slides.length) % slides.length;
  slides.forEach((s, k) => s.classList.toggle('active', k === slideIdx));
  dots.forEach((d, k) => d.classList.toggle('active', k === slideIdx));
}
function nextSlide() { goSlide(slideIdx + 1); }
function prevSlide() { goSlide(slideIdx - 1); }
setInterval(nextSlide, 5000);

let currentType = 'lost';
let currentPage = 1;
const pageSize = 20;

function switchTab(type) {
  currentType = type;
  currentPage = 1;
  document.querySelectorAll('.tab[data-type]').forEach(t => {
    t.classList.toggle('active', t.dataset.type === type);
  });
  loadList();
}

async function loadList() {
  const kw = document.getElementById('kw').value.trim();
  const cat = document.getElementById('category').value;
  const url = `/api/${currentType}?kw=${encodeURIComponent(kw)}&category=${encodeURIComponent(cat)}&page=${currentPage}&page_size=${pageSize}`;
  const r = await api(url);
  const list = r.list || [];
  const box = document.getElementById('list');
  if (!list.length) {
    box.innerHTML = '<div class="empty" style="grid-column:1/-1;">暂无相关信息</div>';
    document.getElementById('pagination').innerHTML = '';
    return;
  }
  box.innerHTML = list.map(it => {
    const location = currentType === 'lost' ? it.location_lost : it.location_found;
    const time = currentType === 'lost' ? it.time_lost : it.time_found;
    return `
    <div class="item-card" onclick="location.href='/detail.html?type=${currentType}&id=${it.id}'">
      ${it.image_path ? `<img src="${escapeHtml(it.image_path)}" style="width:100%;height:140px;object-fit:cover;border-radius:8px;">` : ''}
      <span class="tag ${currentType}">${currentType === 'lost' ? '寻物' : '招领'}</span>
      <div class="title">${escapeHtml(it.title)}</div>
      <div class="meta">${escapeHtml((it.description || '').slice(0, 50))}</div>
      <div class="meta">${icon.location} ${escapeHtml(location || '未知地点')}</div>
      <div class="meta">${icon.clock} ${fmtTime(time)}</div>
    </div>`;
  }).join('');
  renderPagination(r.total_pages || 1, r.total || 0);
}

function renderPagination(totalPages, total) {
  const box = document.getElementById('pagination');
  if (totalPages <= 1) { box.innerHTML = ''; return; }
  let html = `<div class="pagination-info">共 ${total} 条记录，第 ${currentPage}/${totalPages} 页</div><div class="pagination-btns">`;
  html += `<button class="page-btn" ${currentPage===1?'disabled':''} onclick="goPage(${currentPage-1})">上一页</button>`;
  const start = Math.max(1, currentPage - 2);
  const end = Math.min(totalPages, currentPage + 2);
  if (start > 1) html += `<button class="page-btn" onclick="goPage(1)">1</button><span>...</span>`;
  for (let i = start; i <= end; i++) {
    html += `<button class="page-btn ${i===currentPage?'active':''}" onclick="goPage(${i})">${i}</button>`;
  }
  if (end < totalPages) html += `<span>...</span><button class="page-btn" onclick="goPage(${totalPages})">${totalPages}</button>`;
  html += `<button class="page-btn" ${currentPage===totalPages?'disabled':''} onclick="goPage(${currentPage+1})">下一页</button>`;
  html += `</div>`;
  box.innerHTML = html;
}

function goPage(p) {
  currentPage = p;
  loadList();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function handleImageSearch(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  const banner = document.getElementById('image-search-banner');
  const box = document.getElementById('list');
  banner.style.display = 'block';
  banner.innerHTML = '<div class="alert info" style="margin-bottom:0;">图片识别中...</div>';
  box.innerHTML = '';
  try {
    const dataUrl = await compressImage(file, 800, 0.75);
    const r = await api('/api/search-by-image', { method: 'POST', body: { image: dataUrl } });
    if (r.error) {
      banner.innerHTML = `<div class="alert error" style="margin-bottom:0;">${escapeHtml(r.error)}</div>`;
      loadList();
      return;
    }
    const list = r.list || [];
    banner.innerHTML = `
      <div class="alert info" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0;flex-wrap:wrap;gap:8px;">
        <span>以图搜图结果（共 ${list.length} 条相似）</span>
        <button class="btn small secondary" onclick="backToList()">返回列表</button>
      </div>`;
    if (!list.length) {
      box.innerHTML = '<div class="empty" style="grid-column:1/-1;">未找到相似物品</div>';
      return;
    }
    box.innerHTML = list.map(it => `
      <div class="item-card" onclick="location.href='/detail.html?type=found&id=${it.id}'">
        ${it.image_path ? `<img src="${escapeHtml(it.image_path)}" style="width:100%;height:140px;object-fit:cover;border-radius:8px;">` : ''}
        <span class="tag found">招领</span>
        <div class="title">${escapeHtml(it.title)}</div>
        <div class="meta">${escapeHtml((it.description || '').slice(0, 50))}</div>
        <div class="meta">${icon.location} ${escapeHtml(it.location_found || '未知地点')}</div>
        <div class="meta">${icon.clock} ${fmtTime(it.time_found)}</div>
      </div>`).join('');
  } catch (e) {
    banner.innerHTML = `<div class="alert error" style="margin-bottom:0;">图片处理失败：${escapeHtml(e.message || '')}</div>`;
    loadList();
  } finally {
    input.value = '';
  }
}

function backToList() {
  const banner = document.getElementById('image-search-banner');
  banner.style.display = 'none';
  banner.innerHTML = '';
  loadList();
}

loadList();
</script>
</body>
</html>
