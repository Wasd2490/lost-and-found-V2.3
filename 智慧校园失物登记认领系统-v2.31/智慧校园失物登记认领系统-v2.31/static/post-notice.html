<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#3b82f6">
<title>发布招领通知 - 智慧校园失物登记认领系统</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="navbar" id="navbar"></nav>

<div class="container" style="max-width:680px;">
  <div class="page-title">发布招领通知</div>
  <div class="card">
    <div id="msg"></div>
    <div class="form-group">
      <label>物品标题 *</label>
      <input type="text" id="title" placeholder="例如：在食堂捡到一把黑色雨伞">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>物品分类</label>
        <select id="category">
          <option>证件</option>
          <option>电子设备</option>
          <option>钥匙</option>
          <option>衣物</option>
          <option>书籍</option>
          <option selected>其他</option>
        </select>
      </div>
      <div class="form-group">
        <label>捡拾时间</label>
        <input type="datetime-local" id="time_found">
      </div>
    </div>
    <div class="form-group">
      <label>捡拾地点</label>
      <input type="text" id="location_found" placeholder="例如：食堂一楼 / 快递站 / 图书馆">
    </div>
    <div class="form-group">
      <label>物品描述 / 特征</label>
      <textarea id="description" rows="4" placeholder="描述物品特征，不要泄露证件号等隐私信息"></textarea>
    </div>
    <div class="form-group">
      <label>物品照片（选填）</label>
      <input type="file" id="photo" accept="image/*" capture="environment" style="display:none;" onchange="handlePhoto(this)">
      <div id="preview-area" style="display:flex;align-items:flex-start;gap:12px;">
        <button type="button" class="btn secondary small" onclick="document.getElementById('photo').click()">
          拍照 / 上传图片
        </button>
        <div id="preview-wrap" style="display:none;position:relative;">
          <img id="preview" style="width:120px;height:120px;object-fit:cover;border-radius:8px;border:1px solid var(--border);display:block;">
          <button type="button" onclick="removePhoto()"
            style="position:absolute;top:-8px;right:-8px;width:24px;height:24px;border-radius:50%;background:var(--danger);color:#fff;border:none;cursor:pointer;font-size:14px;line-height:1;box-shadow:0 2px 4px rgba(0,0,0,.2);">×</button>
        </div>
        <span id="upload-tip" style="font-size:12px;color:var(--text-secondary);padding-top:4px;"></span>
      </div>
    </div>
    <div class="form-group">
      <label>联系方式</label>
      <input type="text" id="contact" placeholder="手机号或微信，留空则使用注册电话">
    </div>
    <div class="form-group">
      <label>密保问题（可选，用于验证认领人身份）</label>
      <div id="qa-list"></div>
      <button type="button" class="btn small secondary" onclick="addQaRow()">+ 添加一题</button>
      <div style="font-size:12px;color:var(--text-secondary);margin-top:8px;line-height:1.6;">
        设置密保问题后，认领人需回答正确60%以上才能自动通过认领，否则将进入管理员审核。
      </div>
    </div>
    <div class="form-actions">
      <button class="btn" onclick="doSubmit()">提交发布</button>
      <a href="/" class="btn secondary">取消</a>
    </div>
  </div>
</div>

<script src="/js/common.js"></script>
<script>
let imagePath = null;
let qaCount = 0;

function addQaRow() {
  if (qaCount >= 3) { alert('最多设置 3 道密保问题'); return; }
  qaCount++;
  const wrap = document.createElement('div');
  wrap.className = 'qa-row';
  wrap.style.cssText = 'display:flex;gap:8px;margin-bottom:8px;align-items:flex-start;';
  wrap.innerHTML = `
    <input type="text" class="qa-q" placeholder="问题，例如：雨伞是什么颜色？" style="flex:1;padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;">
    <input type="text" class="qa-a" placeholder="答案（仅你和系统知道）" style="flex:1;padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;">
    <button type="button" class="btn small danger" onclick="this.parentElement.remove()">删除</button>
  `;
  document.getElementById('qa-list').appendChild(wrap);
}

function collectQa() {
  const rows = document.querySelectorAll('#qa-list .qa-row');
  const qa = [];
  rows.forEach(r => {
    const q = r.querySelector('.qa-q').value.trim();
    const a = r.querySelector('.qa-a').value.trim();
    if (q && a) qa.push({ q, a });
  });
  return qa;
}

// 默认显示 1 组
addQaRow();

function removePhoto() {
  imagePath = null;
  document.getElementById('preview-wrap').style.display = 'none';
  document.getElementById('preview').src = '';
  document.getElementById('upload-tip').textContent = '';
  document.getElementById('photo').value = '';
}

function handlePhoto(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async function(e) {
    const img = new Image();
    img.onload = async function() {
      const canvas = document.createElement('canvas');
      const maxW = 800;
      const scale = Math.min(1, maxW / img.width);
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
      document.getElementById('preview').src = dataUrl;
      document.getElementById('preview-wrap').style.display = 'block';
      document.getElementById('upload-tip').textContent = '上传中...';
      const r = await api('/api/upload', { method: 'POST', body: { image: dataUrl } });
      if (r.ok) {
        imagePath = r.path;
        document.getElementById('upload-tip').textContent = '已上传';
      } else {
        document.getElementById('upload-tip').textContent = r.error || '上传失败';
      }
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

async function doSubmit() {
  const timeVal = document.getElementById('time_found').value;
  const data = {
    title: document.getElementById('title').value.trim(),
    category: document.getElementById('category').value,
    time_found: timeVal ? timeVal.replace('T', ' ') + ':00' : null,
    location_found: document.getElementById('location_found').value.trim(),
    description: document.getElementById('description').value.trim(),
    contact: document.getElementById('contact').value.trim(),
    image_path: imagePath,
    qa: collectQa(),
  };
  if (!data.title) {
    document.getElementById('msg').innerHTML = '<div class="alert error">请填写物品标题</div>';
    return;
  }
  const r = await api('/api/found', { method: 'POST', body: data });
  if (r.error) {
    if (r.error.includes('登录')) location.href = '/login.html';
    document.getElementById('msg').innerHTML = `<div class="alert error">${escapeHtml(r.error)}</div>`;
    return;
  }
  document.getElementById('msg').innerHTML = '<div class="alert success">发布成功，等待管理员审核后展示。</div>';
  setTimeout(() => location.href = '/my.html', 1200);
}
</script>
</body>
</html>
